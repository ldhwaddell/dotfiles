gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
os:
  # edit/editAtLine below override the preset: open in a vertical split of the
  # parent nvim. `q` quits lazygit first so its float closes.
  editPreset: nvim-remote
  edit: >-
    [ -z "$NVIM" ] && nvim -- {{filename}} || (nvim --server "$NVIM" --remote-send "q" &&
    nvim --server "$NVIM" --remote-expr 'execute("vsplit " . fnameescape({{filename}}))')
  editAtLine: >-
    [ -z "$NVIM" ] && nvim +{{line}} -- {{filename}} || (nvim --server "$NVIM" --remote-send "q" &&
    nvim --server "$NVIM" --remote-expr 'execute("vsplit " . fnameescape({{filename}}) . " | " . {{line}})')
